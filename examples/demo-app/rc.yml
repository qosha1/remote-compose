version: 2
project: demo-app
compose_file: docker-compose.yml

provider: ecs

provider_config:
  ecs:
    region: us-east-1
    cluster: demo-app-cluster
    vpc_cidr: 10.77.0.0/16
    default_launch_type: FARGATE
    ec2_capacity:
      instance_type: null            # auto-size
      capacity_type: SPOT            # cheap + demonstrates the spot path
      min: 1
      max: 3
      desired: 1

terraform:
  output_dir: ./terraform/${provider}
  backend:
    type: local

services:
  api:
    cpu: 512
    memory: 1024
    replicas: 1
    type: application
    launch_type: FARGATE
    public: true
    port: 8080
    health_check_path: /health

  worker:
    cpu: 1024
    memory: 2048
    replicas: 1
    type: worker
    launch_type: EC2                 # exercises the EC2 + ASG path

  db:
    cpu: 512
    memory: 1024
    replicas: 1
    type: infrastructure
    launch_type: FARGATE
    # NOTE: EFS volume for db is tracked in rc-e5u.27 (postgres uid vs
    # EFS access-point posix_user conflict). Production users should use
    # RDS for Postgres rather than ECS+EFS.
    # volumes:
    #   - name: pgdata
    #     mount: /var/lib/postgresql/data

  cache:
    cpu: 256
    memory: 512
    replicas: 1
    type: infrastructure
    launch_type: FARGATE

secrets:
  - name: app_secret_key
    source: file
    path: .env.production            # rc secrets push uploads values after apply
