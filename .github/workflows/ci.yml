name: CI

# rc-nq6.1: the merge gate. Runs the fast tier (unit + contract, all-mock,
# ~25s) on every PR and every push to main. Unlike release.yml's test job —
# which is continue-on-error / informational — this job is BLOCKING: a red
# test here fails the check and (with branch protection) blocks merge.
#
# The slower integration tier (real terraform + moto/LocalStack) and the e2e
# tier (real AWS) are intentionally NOT run here — they get their own gated
# workflows (rc-kfa.3 nightly/labeled, rc-2pw.1 scheduled).

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't pile up
# redundant CI jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # rc-nq6.2: blocking format + lint gate. black is the single authority on
    # formatting/line-length; flake8 (config in .flake8, E501 delegated to
    # black) catches unused imports, dead code, undefined names, etc.
    name: Lint (black + flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,ecs]"

      - name: black --check
        run: black --check remote_compose/ tests/ scripts/

      - name: flake8
        run: flake8 remote_compose/ tests/ scripts/

  fast-tier:
    name: Unit + contract (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # rc-nq6.4: full python coverage on ubuntu; macOS on the primary
        # python only — the fast tier is all-mock, so one macOS combo catches
        # path/subprocess/SSH platform breakage without paying for the full
        # 2x2 grid on the pricier runner.
        os: [ubuntu-latest]
        python: ['3.11', '3.12']
        include:
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,ecs]"

      - name: Run unit + contract tier
        # pytest-randomly (a dev dep) auto-activates here, so the gate runs in
        # a randomized order every time and prints its seed — surfacing
        # order-dependence on the very next PR. Deeper flaky detection (repeat
        # runs + rerun report) lives in flaky.yml (nightly). rc-0b3.2.
        # --timeout=60: per-test hang guard (rc-0b3.3) — a fast-tier test that
        # runs >60s is a hang (unmocked network, deadlock), killed deterministically.
        run: |
          pytest tests/unit tests/contract -q --timeout=60

  coverage:
    # rc-nq6.3: enforce a coverage floor on the fast tier and publish the
    # report. Floor is set below the current measured fast-tier coverage
    # (57.65%) to absorb cross-version noise; ratchet it upward as the suite
    # grows. Runs once (ubuntu/py3.12) — coverage of mocked code is
    # platform-independent, so a matrix would only add cost + variance.
    name: Coverage (fast tier, floor 57%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,ecs]"

      - name: Run fast tier with coverage (fail under 57%)
        run: |
          pytest tests/unit tests/contract -q \
            --timeout=60 \
            --cov=remote_compose \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=57

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
