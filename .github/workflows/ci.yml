name: CI

# rc-nq6.1: the merge gate. Runs the fast tier (unit + contract, all-mock,
# ~25s) on every PR and every push to main. Unlike release.yml's test job —
# which is continue-on-error / informational — this job is BLOCKING: a red
# test here fails the check and (with branch protection) blocks merge.
#
# The slower integration tier (real terraform + moto/LocalStack) and the e2e
# tier (real AWS) are intentionally NOT run here — they get their own gated
# workflows (rc-kfa.3 nightly/labeled, rc-2pw.1 scheduled).

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't pile up
# redundant CI jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # rc-nq6.2: blocking format + lint gate. black is the single authority on
    # formatting/line-length; flake8 (config in .flake8, E501 delegated to
    # black) catches unused imports, dead code, undefined names, etc.
    name: Lint (black + flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,ecs]"

      - name: black --check
        run: black --check remote_compose/ tests/ scripts/

      - name: flake8
        run: flake8 remote_compose/ tests/ scripts/

  fast-tier:
    name: Unit + contract (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # rc-nq6.4 will broaden this to add macOS; the fast tier is all-mock
        # so a single OS catches the vast majority of regressions cheaply.
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,ecs]"

      - name: Run unit + contract tier
        run: |
          pytest tests/unit tests/contract -q
