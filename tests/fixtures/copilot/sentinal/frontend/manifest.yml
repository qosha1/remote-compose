# The manifest for the "frontend" service.
# Read the full specification for the "Backend Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/backend-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: frontend
type: Backend Service

# Configuration for your containers and service.
image:
  # Docker build arguments. For additional overrides: https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/#image-build
  build:
    context: ./
    dockerfile: ./compose/production/frontend/Dockerfile
  # Port exposed through your container to route traffic to it.
  port: 3000

# Distribute traffic to your service.
#http:
# Requests to this path will be forwarded to your service.
# To match all requests you can use the "/" path.
#  path: '/'
#  alias: ['*.debugg.ai', 'admin-console.debugg.ai', 'testing.debugg.ai']
#  target_container: 'nginx'
# You can specify a custom health check path. The default is "/".
#  healthcheck:
#    path: '/'
#    success_codes: '200'
#    healthy_threshold: 2
#    unhealthy_threshold: 3
#    interval: 30s
#    timeout: 15s
#    grace_period: 90s

cpu: 512 # Number of CPU units for the task.
memory: 1024 # Amount of memory in MiB used by the task.
count: 1 # Number of tasks that should be running in your service.
exec: true # Enable running commands in your container.
network:
  connect: true # Enable Service Connect for intra-environment traffic between services.

# Optional fields for more advanced use-cases.
#
variables: # Pass environment variables as key value pairs.
  REACT_APP_BACKEND_AUTH_ENDPOINT: /token/
  REACT_APP_BACKEND_AUTH_REFRESH: /token/refresh/
  REACT_APP_VERSION: v1.0.0
  GENERATE_SOURCEMAP: false

secrets:
  # Database secret handling
  REACT_APP_AWS_ACCESS_ID_KEY:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:AWS_ACCESS_KEY_ID::'
  REACT_APP_AWS_SECRET_KEY:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:AWS_SECRET_ACCESS_KEY::'

# You can override any of the values defined above by environment.

environments:
  production:
    variables:
      ENVIRONMENT: production
      REACT_APP_CUSTOMER_EMAIL_DOMAIN: docs.debugg.ai
      REACT_APP_BACKEND_API_URL: https://api.debugg.ai/api/v1
      REACT_APP_BACKEND_HOST: debugg.ai
      ## Backend API URL
      REACT_APP_API_URL: https://api.debugg.ai/api/v1

  staging:
    # Configuration for your containers and service.
    image:
      # Docker build arguments. For additional overrides: https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/#image-build
      build:
        context: ./
        dockerfile: ./compose/staging/frontend/Dockerfile
      # Port exposed through your container to route traffic to it.
      port: 3000
    variables:
      REACT_APP_API_URL: https://api.st.debugg.ai/api/v1
      REACT_APP_BACKEND_API_URL: https://api.st.debugg.ai/api/v1
      REACT_APP_BACKEND_HOST: st.debugg.ai
      REACT_APP_CUSTOMER_EMAIL_DOMAIN: staging.debugg.ai

    deployment: # The deployment strategy for the "test" environment.
      rolling: 'recreate' # Stops existing tasks before new ones are started for faster deployments.
  #    variables:
  dev:
    # Configuration for your containers and service.
    image:
      # Docker build arguments. For additional overrides: https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/#image-build
      build:
        context: ./
        dockerfile: ./compose/dev/frontend/Dockerfile
      # Port exposed through your container to route traffic to it.
      port: 3000
    variables:
      REACT_APP_API_URL: https://api.dev.debugg.ai/api/v1
      REACT_APP_BACKEND_API_URL: https://api.dev.debugg.ai/api/v1
      REACT_APP_BACKEND_HOST: dev.debugg.ai
      REACT_APP_CUSTOMER_EMAIL_DOMAIN: dev.debugg.ai
#environments:
#  test:
#    count: 2               # Number of tasks to run for the "test" environment.
#    deployment:            # The deployment strategy for the "test" environment.
#       rolling: 'recreate' # Stops existing tasks before new ones are started for faster deployments.
