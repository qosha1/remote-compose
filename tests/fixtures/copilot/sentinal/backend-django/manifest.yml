# The manifest for the "backend-django" service.
# Read the full specification for the "Request-Driven Web Service" type at:
# https://aws.github.io/copilot-cli/docs/manifest/rd-web-service/

# Your service name will be used in naming your resources like log groups, App Runner services, etc.
name: backend-django
# The "architecture" of the service you're running.
type: Backend Service

image:
  location: 123456789012.dkr.ecr.us-east-2.amazonaws.com/debugg-ai-web/backend-django:${TAG}
  # Docker build arguments.
  # For additional overrides: https://aws.github.io/copilot-cli/docs/manifest/rd-web-service/#image-build
  # build:
  #     context: ./
  #     dockerfile: ./compose/production/django/Dockerfile
  #     args:
  #       tag: "prod_sentinal_django:latest"

  # Port exposed through your container to route traffic to it.
  port: 8001
  healthcheck:
    command: ['CMD-SHELL', 'curl -f http://localhost:8001/health || exit 1']
    interval: 30s
    retries: 4
    timeout: 15s
    grace_period: 60s

#
#http:
#  private: true
# healthcheck:
#   path: /
#   healthy_threshold: 3
#   unhealthy_threshold: 5
#   interval: 10s
#   timeout: 5s

# Number of CPU units for the task.
cpu: 2048
# Amount of memory in MiB used by the task.
memory: 4096

exec: true # Enable running commands in your container.
network:
  connect: true # Enable Service Connect for intra-environment traffic between services.

secrets:
  # Database secret handling
  POSTGRES_USER:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_USERNAME::'
  POSTGRES_PASSWORD:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_PASSWORD::'
  POSTGRES_HOST:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_ENDPOINT::'
  POSTGRES_PORT:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_PORT::'
  POSTGRES_DB:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_NAME::'

  AWS_ACCESS_KEY_ID:
