# The manifest for the "langflow" service.
# Read the full specification for the "Backend Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/backend-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: langflow
type: Backend Service

# Your service does not allow any traffic.

# Configuration for your containers and service.
image:
  build:
    context: ./
    dockerfile: ./compose/production/langflow/Dockerfile
  port: 7860

cpu: 1024 # Number of CPU units for the task.
memory: 2048 # Amount of memory in MiB used by the task.
count: 1 # Number of tasks that should be running in your service.
exec: true # Enable running commands in your container.

secrets:
  # Database secret handling
  POSTGRES_USER:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_USERNAME::'
  POSTGRES_PASSWORD:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_PASSWORD::'
  POSTGRES_HOST:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_ENDPOINT::'
  POSTGRES_PORT:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:MAIN_DB_PORT::'
  BROWSERLESS_API_KEY:
    secretsmanager: '${COPILOT_ENVIRONMENT_NAME}/debugg-ai-web/creds:BROWSERLESS_API_KEY::'

# Optional fields for more advanced use-cases.
#
variables: # Pass environment variables as key value pairs.
  POSTGRES_DB: langflow

# You can override any of the values defined above by environment.
environments:
  production:
    variables:
      #      LANGFLOW_DATABASE_URL:
      LANGFLOW_CONFIG_DIR: /app/langflow
#  test:
#    count: 2               # Number of tasks to run for the "test" environment.
#    deployment:            # The deployment strategy for the "test" environment.
#       rolling: 'recreate' # Stops existing tasks before new ones are started for faster deployments.
