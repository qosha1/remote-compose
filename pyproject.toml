[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-remote-compose"
version = "0.1.0"
description = "Django app for deploying Docker Compose to remote hosts via SSH"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["django", "docker", "compose", "deployment", "aws", "ec2", "ssh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Django>=4.2,<5.0",
    "paramiko>=3.0.0",
    "cryptography>=41.0.0",
    "boto3>=1.26.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
celery = ["celery>=5.3.0", "redis>=5.0.0"]
ecs = [
    "python-hcl2>=4.3",
    "jinja2>=3.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10",
    "factory-boy>=3.3.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    # Provider validation tooling (Phase 6b.7)
    "python-hcl2>=4.3",
    "moto[ecs,secretsmanager,logs]>=5.0",
    "jinja2>=3.1",
]

[project.scripts]
rc = "remote_compose.cli:cli"

[project.urls]
Homepage = "https://github.com/yourusername/django-remote-compose"
Documentation = "https://github.com/yourusername/django-remote-compose#readme"
Repository = "https://github.com/yourusername/django-remote-compose"
Issues = "https://github.com/yourusername/django-remote-compose/issues"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: pure-Python unit tests; zero external dependencies",
    "contract: provider contract tests, parameterized across providers",
    "integration: provider-specific integration (real terraform, LocalStack, kind)",
    "e2e: end-to-end smoke tests against real cloud targets (opt-in)",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.coverage.run]
source = ["remote_compose"]
omit = ["*/migrations/*", "*/tests/*"]
