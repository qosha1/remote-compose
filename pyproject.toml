[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-compose"
version = "0.5.0"
description = "Deploy docker-compose stacks to AWS ECS — terraform-backed, multi-cloud-ready"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Quinn", email = "quinnosha@gmail.com"}
]
keywords = ["docker", "compose", "deployment", "aws", "ecs", "terraform", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.26.0",
    "click>=8.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # The legacy v1 imperative path bootstraps Django lazily inside
    # cli_commands/_legacy.py:_bootstrap_django. v2 deploys (rc deploy
    # --no-state, rc up, rc v1 migrate) don't import it. Kept as a
    # core dep for v0.1.x to preserve v1 compatibility; planned to
    # move under [django] extra once v1 is fully deprecated.
    "Django>=4.2,<5.0",
    "paramiko>=3.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
celery = ["celery>=5.3.0", "redis>=5.0.0"]
ecs = [
    "python-hcl2>=4.3",
]
dev = [
    "pytest>=7.4.0",
    # <4.13.0: 4.13.0 (released 2026-08-05) dropped support for Django<5.2 and
    # breaks pytest DB fixtures with `PytestDjangoTestCase has no attribute
    # '_pre_setup_ran_eagerly'` — this repo pins Django>=4.2,<5.0 above.
    "pytest-django>=4.5.0,<4.13.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10",
    # rc-0b3.2: flaky-test detection. pytest-randomly shuffles test order
    # every run (with a printed seed) to surface order-dependence;
    # pytest-rerunfailures powers the nightly flaky-detection job (reruns
    # failures and reports which only pass on retry).
    "pytest-randomly>=3.15",
    "pytest-rerunfailures>=14.0",
    # rc-0b3.3: per-test hang guard for the fast tier (CI passes --timeout).
    "pytest-timeout>=2.3",
    "factory-boy>=3.3.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "python-hcl2>=4.3",
    "moto[ecs,secretsmanager,logs,ec2,efs,elbv2,acm]>=5.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
rc = "remote_compose.cli:cli"

[project.urls]
Homepage = "https://github.com/qosha1/remote-compose"
Documentation = "https://github.com/qosha1/remote-compose#readme"
Repository = "https://github.com/qosha1/remote-compose"
Issues = "https://github.com/qosha1/remote-compose/issues"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
remote_compose = [
    "provider/ecs/templates/*.j2",
    "v1_migrate/*.md",
    "templates/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# Put the repo root on sys.path so `tests.settings` (and the `tests` package)
# imports under a bare `pytest` invocation, not just `python -m pytest`. Without
# this, pytest-django fails at startup with "No module named 'tests'" in CI,
# where `pytest` is called directly and CWD is not auto-added to sys.path.
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: pure-Python unit tests; zero external dependencies",
    "contract: provider contract tests, parameterized across providers",
    "integration: provider-specific integration (real terraform, LocalStack, kind)",
    "e2e: end-to-end smoke tests against real cloud targets (opt-in)",
    "slow: tests over 5s wall-clock; deselect via -m 'not slow' for fast loops",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.coverage.run]
source = ["remote_compose"]
omit = ["*/migrations/*", "*/tests/*"]
